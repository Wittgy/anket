<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="styles.css">
    <title>Form Gönderildi</title>
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px 16px;
        }
        .success-container {
            max-width: 560px;
            width: 100%;
            text-align: center;
        }
        .checkmark-wrap {
            margin: 0 auto 32px;
            width: 80px;
            height: 80px;
            position: relative;
        }
        .checkmark-circle {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent), #7c3aed);
            display: flex;
            align-items: center;
            justify-content: center;
            animation: circleIn 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 40px var(--accent-glow);
        }
        .checkmark-circle svg {
            width: 40px;
            height: 40px;
        }
        .checkmark-circle svg path {
            stroke: #fff;
            stroke-width: 3;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
            stroke-dasharray: 50;
            stroke-dashoffset: 50;
            animation: drawCheck 0.45s cubic-bezier(0.4, 0, 0.2, 1) 0.3s forwards;
        }
        @keyframes circleIn {
            0% { transform: scale(0); opacity: 0; }
            60% { transform: scale(1.15); }
            100% { transform: scale(1); opacity: 1; }
        }
        @keyframes drawCheck {
            to { stroke-dashoffset: 0; }
        }
        .success-container h1 {
            font-size: clamp(1.5rem, 4vw, 2rem);
            font-weight: 700;
            margin-bottom: 8px;
            animation: fadeUp 0.5s ease 0.4s both;
        }
        .success-container .description {
            margin-bottom: 32px;
            animation: fadeUp 0.5s ease 0.5s both;
        }
        .success-card {
            background: var(--glass);
            backdrop-filter: blur(24px) saturate(1.4);
            -webkit-backdrop-filter: blur(24px) saturate(1.4);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-xl);
            padding: 32px 24px;
            box-shadow: var(--shadow-lg);
            animation: fadeUp 0.5s ease 0.6s both;
            text-align: left;
        }
        @media (min-width: 480px) {
            .success-card { padding: 40px 32px; }
        }
        .success-card ul {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .success-card ul li {
            padding: 12px 16px;
            background: var(--surface);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: var(--radius-md);
            font-size: 0.875rem;
            line-height: 1.5;
            transition: var(--transition);
        }
        .success-card ul li:hover {
            background: var(--surface-hover);
        }
        .success-card ul li strong {
            color: var(--accent-hover);
            font-weight: 600;
            display: inline-block;
            min-width: 100px;
            margin-right: 8px;
        }
        @keyframes fadeUp {
            0% { opacity: 0; transform: translateY(16px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 24px;
            padding: 10px 24px;
            color: var(--text-secondary);
            font-size: 0.875rem;
            font-weight: 500;
            text-decoration: none;
            border: 1.5px solid rgba(255, 255, 255, 0.08);
            border-radius: var(--radius-md);
            transition: var(--transition);
            animation: fadeUp 0.5s ease 0.8s both;
        }
        .back-link:hover {
            border-color: var(--accent);
            color: var(--text-primary);
            background: rgba(139, 92, 246, 0.06);
        }
    </style>
</head>
<body>
    <div class="container" style="display:flex;align-items:center;justify-content:center;">
        <div class="success-container">
            <div class="checkmark-wrap">
                <div class="checkmark-circle">
                    <svg viewBox="0 0 24 24">
                        <path d="M5 13l4 4L19 7"/>
                    </svg>
                </div>
            </div>
            <h1 id="title">Form Gönderildi!</h1>
            <p id="description" class="description" style="display:block;">Form verileriniz başarıyla alındı:</p>
            <div class="success-card">
                <ul>
                    {% for key, value in form_data.items() %}
                        <li><strong>{{ key }}:</strong> {{ value }}</li>
                    {% endfor %}
                </ul>
            </div>
            <a href="/" class="back-link">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
                Ankete Geri Dön
            </a>
        </div>
    </div>
</body>
</html>
